name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exercises:
    name: Exercise checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Run all exercises
        run: python scripts/check_exercises.py

  ruff:
    name: Ruff checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Install Ruff
        run: python -m pip install "ruff>=0.11,<1"
      - name: Check lint
        run: python -m ruff check .
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: python -m ruff format --check .
