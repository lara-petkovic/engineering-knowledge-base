repos:
  - repo: local
    hooks:
      - id: exercise-checks
        name: Run exercise checks
        entry: python scripts/check_exercises.py
        language: python
        language_version: python3.15
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: Ruff lint
        entry: ruff check .
        language: python
        language_version: python3.15
        additional_dependencies: ["ruff>=0.11,<1"]
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check .
        language: python
        language_version: python3.15
        additional_dependencies: ["ruff>=0.11,<1"]
        pass_filenames: false
        always_run: true
